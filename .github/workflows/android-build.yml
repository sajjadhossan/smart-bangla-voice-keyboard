# Guarded: manual trigger only. Debug APK build — no signing secrets involved.
# Release signing is intentionally NOT here (needs keystore env secrets).
name: Android debug APK build (manual)

on:
  workflow_dispatch:

jobs:
  build-debug:
    name: Build signed debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Verify APK signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
